name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Android import guard
        run: pnpm check:android-imports

      - name: Android Metro build
        run: pnpm --filter @agentmoataz/app-android build

      - name: Test (non-watch)
        run: pnpm test

  android-debug:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Expo prebuild Android
        working-directory: apps/android
        run: pnpm exec expo prebuild --platform android --clean

      - name: Assemble debug APK
        working-directory: apps/android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: agentmoataz-debug-apk
          path: apps/android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
